steps:
  # 1. Build the container image using Docker
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${_VERSION}',
      '.'
    ]

  # 2. Push all tags to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      '--all-tags',
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}'
    ]

  # 3. Deploy to Google Cloud Run with optimized resource parameters
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', '${_SERVICE_NAME}',
      '--image', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${_VERSION}',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--cpu', '1',
      '--memory', '2Gi',
      '--min-instances', '0',
      '--max-instances', '1',
      '--port', '8080'
    ]

# Keep build images cataloged
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${_VERSION}'

# Parameters that the user can override via Cloud Build triggers or CLI flags
substitutions:
  _SERVICE_NAME: 'kids-podcast-generator'
  _REGION: 'europe-west1'
  _GAR_REPOSITORY: 'podcasts-repo'
  _VERSION: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
